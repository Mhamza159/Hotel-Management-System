<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>Hub Connection</title>
    <style>
      :root {
        --ink: #0a0f1a;
        --surface: #131a26;
        --surface-2: #1b2433;
        --border: #2a3547;
        --text: #eceff3;
        --muted: #8791a3;
        --gold: #c9a15a;
        --aqua: #3fd0c9;
        --success: #3ecf8e;
        --danger: #f2545b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--ink);
        color: var(--text);
        font-family: 'Segoe UI', Inter, system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 480px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 28px;
      }
      .brand {
        font-size: 11px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--gold);
        margin: 0 0 6px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 6px;
      }
      p.help {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
        margin: 0 0 20px;
      }
      label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        padding: 11px 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--surface-2);
        color: var(--text);
        font-size: 14px;
        font-family: Consolas, 'Courier New', monospace;
      }
      input:focus {
        outline: none;
        border-color: var(--aqua);
      }
      .example {
        font-size: 12px;
        color: var(--muted);
        margin-top: 6px;
      }
      .actions {
        display: flex;
        gap: 10px;
        margin-top: 22px;
      }
      button {
        flex: 1;
        padding: 11px 14px;
        border-radius: 10px;
        border: 1px solid var(--border);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button.secondary {
        background: var(--surface-2);
        color: var(--text);
      }
      button.primary {
        background: var(--aqua);
        border-color: var(--aqua);
        color: var(--ink);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .status {
        margin-top: 18px;
        padding: 10px 12px;
        border-radius: 10px;
        font-size: 13px;
        display: none;
      }
      .status.ok {
        display: block;
        background: rgba(62, 207, 142, 0.1);
        border: 1px solid rgba(62, 207, 142, 0.35);
        color: var(--success);
      }
      .status.error {
        display: block;
        background: rgba(242, 84, 91, 0.1);
        border: 1px solid rgba(242, 84, 91, 0.35);
        color: var(--danger);
      }
      .status.info {
        display: block;
        background: var(--surface-2);
        border: 1px solid var(--border);
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="brand">Grand Horizon Staff</p>
      <h1>Connect to the hotel Hub</h1>
      <p class="help">
        Enter the address of the Hub PC that runs the hotel server on your local network.
        Every staff PC must point to the same Hub so everyone sees the same data.
      </p>

      <form id="hub-form" novalidate>
        <label for="hub-url">Hub address</label>
        <input id="hub-url" name="hubUrl" type="text" autocomplete="off" spellcheck="false" />
        <div class="example">Example: 192.168.1.10:5000 or http://hub-pc:5000</div>

        <div class="actions">
          <button type="button" id="test-btn" class="secondary">Test connection</button>
          <button type="submit" id="save-btn" class="primary">Save &amp; connect</button>
        </div>
      </form>

      <div id="status" class="status" role="status" aria-live="polite"></div>
    </main>

    <script src="settings.js"></script>
  </body>
</html>
